name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@main

      - name: Set up JDK 21
        uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle to use the installed JDK
        run: echo "org.gradle.java.installations.paths=$JAVA_HOME" >> gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@main

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Prepare CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/luckytool-ci.jks \
            -storepass android \
            -keypass android \
            -alias luckytool-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=LuckyTool CI, OU=Build, O=LuckyTool, L=CI, ST=CI, C=US'
          cat > keystore/keystore.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/keystore/luckytool-ci.jks
          storePassword=android
          keyAlias=luckytool-ci
          keyPassword=android
          EOF
        
      - name: Prepare R8 obfuscation dictionary
        shell: bash
        run: |
          cat > keystore/proguard-custom.txt <<'EOF'
          aurora
          beacon
          cedar
          ...
          zephyr
          EOF
        
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@main

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: LuckyTool-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
